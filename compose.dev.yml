# ==========================================================
# VeriFace AI - Local Development Overrides
# ==========================================================
#
# Usage:
#
#   docker compose \
#     -f compose.yml \
#     -f compose.dev.yml \
#     up -d --build
#
# This file extends compose.yml for local development.
# It is NOT intended for CI or production deployment.
#
# ==========================================================

services:
  # ==========================================================
  # PostgreSQL - Development
  # ==========================================================

  postgres:
    # --------------------------------------------------------
    # Expose PostgreSQL to the host machine
    #
    # Host:
    #   localhost:5432
    #
    # Docker network:
    #   postgres:5432
    # --------------------------------------------------------

    ports:
      - "5432:5432"

  # ==========================================================
  # FastAPI Backend - Development
  # ==========================================================

  backend:
    # --------------------------------------------------------
    # Development Environment
    # --------------------------------------------------------

    environment:
      ENVIRONMENT: development

      # Never automatically migrate the legacy SQLite
      # database during normal development startup.
      MIGRATE_LEGACY_DB: "false"

      # Application data inside container
      DATA_DIR: /app/data

    # --------------------------------------------------------
    # Expose FastAPI directly to host
    #
    # Host:
    #   http://localhost:8002
    #
    # Docker network:
    #   http://backend:8002
    # --------------------------------------------------------

    ports:
      - "8002:8002"

    # --------------------------------------------------------
    # Development Volumes
    # --------------------------------------------------------

    volumes:
      # Application source code
      #
      # Changes made locally become immediately available
      # inside the backend container.
      - ./backend/src:/app/src

      # Alembic migrations
      - ./backend/migrations:/app/migrations

      # Alembic configuration
      - ./backend/alembic.ini:/app/alembic.ini:ro

      # Persistent application data
      - backend_data:/app/data

      # Application-managed ML models
      - backend_models:/app/models

      # DeepFace model weights
      - deepface_weights:/root/.deepface/weights

      # Backend logs
      - backend_logs:/app/logs

  # ==========================================================
  # Nginx + React - Development
  # ==========================================================

  web:
    # --------------------------------------------------------
    # Development Web Port
    #
    # Host:
    #   http://localhost:8080
    #
    # Container:
    #   nginx:8000
    #
    # Using 8080 avoids requiring privileged port 80 and
    # reduces conflicts with locally installed web servers.
    # --------------------------------------------------------

    ports:
      - "8080:8000"

# ==========================================================
# Development Notes
# ==========================================================
#
# PostgreSQL:
#
#   Host access:
#       localhost:5432
#
#   Container access:
#       postgres:5432
#
#
# FastAPI:
#
#   Direct host access:
#       http://localhost:8002
#
#   Health endpoint:
#       http://localhost:8002/health/
#
#
# React + Nginx:
#
#       http://localhost:8080
#
#
# API through Nginx:
#
#       http://localhost:8080/api/...
#
#
# Internal Docker communication MUST continue using:
#
#       backend:8002
#       postgres:5432
#
# Do NOT use localhost for communication between containers.
#
# ==========================================================
