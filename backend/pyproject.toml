[project]
name = "face-attendance-system-backend"
version = "0.1.0"
description = "AI-powered Face Recognition Attendance System using FastAPI and DeepFace"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Sabarna Guha" }
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",

    "deepface>=0.0.92",
    "opencv-python>=4.9.0.80",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tf-keras>=2.20.1",

    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",

    "sqlalchemy>=2.0.25",
    "alembic>=1.18.4",
    "psycopg[binary]>=3.3.4",

    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",

    "passlib[argon2,bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",

    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.28.1",
    "black>=25.12.0",
    "ruff>=0.14.9",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"