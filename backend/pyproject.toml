[project]
name = "face-attendance-system-backend"
version = "0.1.0"
description = "AI-powered Face Recognition Attendance System using FastAPI and DeepFace"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "Sabarna Guha" }
]

# ==========================================================
# Runtime Dependencies
# ==========================================================

dependencies = [
    # Web / API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    # AI / Computer Vision
    "deepface>=0.0.92",
    "opencv-python>=4.9.0.80,<5",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tf-keras>=2.20.1",
    # Configuration / Validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.18.4",
    "psycopg[binary]>=3.3.4",
    # Authentication / Security
    "passlib[argon2,bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    # API Utilities
    "python-multipart>=0.0.9",
    # Logging
    "loguru>=0.7.2",
    "pytz>=2026.3.post1",
    "supabase>=2.31.0",
    "black>=26.5.1",
    "ruff>=0.16.0",
    "cryptography>=50.0.0",
]

# ==========================================================
# Development Dependencies
# ==========================================================

[project.optional-dependencies]

dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.0",
    "black>=26.5.1",
    "mypy>=2.3.0",
]

# ==========================================================
# Pytest
# ==========================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

# ==========================================================
# Black
# ==========================================================

[tool.black]
line-length = 88
target-version = ["py313"]

# ==========================================================
# Ruff
# ==========================================================

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

# ==========================================================
# MyPy
# ==========================================================

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true

# ==========================================================
# Build System
# ==========================================================

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
