name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

# ============================================================
# Global Permissions
# ============================================================

permissions:
  contents: read

# ============================================================
# Concurrency
# ============================================================

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# Environment
# ============================================================

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ==========================================================
  # Backend Verification
  # ==========================================================

  backend:
    name: Backend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      # ------------------------------------------------------
      # Repository
      # ------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ------------------------------------------------------
      # uv
      # ------------------------------------------------------

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml

      # ------------------------------------------------------
      # Validation
      # ------------------------------------------------------

      - name: Run Backend Validation
        run: ./scripts/backend_ci.sh

  # ==========================================================
  # Frontend Verification
  # ==========================================================

  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      # ------------------------------------------------------
      # Repository
      # ------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Node
      # ------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ------------------------------------------------------
      # Validation
      # ------------------------------------------------------

      - name: Run Frontend Validation
        run: ./scripts/frontend.sh
  # ==========================================================
  # CI Summary / Required Gate
  # ==========================================================

  summary:
    name: CI Summary
    runs-on: ubuntu-latest

    if: always()

    needs:
      - backend
      - frontend

    steps:
      - name: Generate CI Summary
        run: |
          {
            echo "# VeriFace AI — CI Summary"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Backend | ${{ needs.backend.result }} |"
            echo "| Frontend | ${{ needs.frontend.result }} |"
            echo
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo
            echo "**Commit:** \`${{ github.sha }}\`"
            echo
            echo "**Triggered by:** \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Required Jobs
        if: |
          needs.backend.result != 'success' ||
          needs.frontend.result != 'success'
        run: |
          echo "One or more required CI stages failed."
          exit 1
