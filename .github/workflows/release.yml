name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

# ==========================================================
# Permissions
# ==========================================================

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

# ==========================================================
# Concurrency
# ==========================================================

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:

# ==========================================================
# Build & Publish Containers
# ==========================================================

  publish:

    name: Build & Publish Images

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

# ----------------------------------------------------------
# Checkout
# ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

# ----------------------------------------------------------
# Setup Buildx
# ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

# ----------------------------------------------------------
# Login GHCR
# ----------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

# ----------------------------------------------------------
# Extract Docker Metadata
# ----------------------------------------------------------

      - name: Backend Docker Metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/veriface-ai-backend

          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha

      - name: Frontend Docker Metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/veriface-ai-frontend

          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha

# ----------------------------------------------------------
# Build Backend
# ----------------------------------------------------------

      - name: Build & Push Backend
        id: backend

        uses: docker/build-push-action@v6

        with:
          context: ./backend

          file: ./backend/Dockerfile

          push: true

          provenance: true

          sbom: true

          tags: ${{ steps.backend_meta.outputs.tags }}

          labels: ${{ steps.backend_meta.outputs.labels }}

          cache-from: type=gha

          cache-to: type=gha,mode=max

# ----------------------------------------------------------
# Build Frontend
# ----------------------------------------------------------

      - name: Build & Push Frontend
        id: frontend

        uses: docker/build-push-action@v6

        with:
          context: ./frontend

          file: ./frontend/Dockerfile

          push: true

          provenance: true

          sbom: true

          tags: ${{ steps.frontend_meta.outputs.tags }}

          labels: ${{ steps.frontend_meta.outputs.labels }}

          cache-from: type=gha

          cache-to: type=gha,mode=max

# ----------------------------------------------------------
# Attest Backend
# ----------------------------------------------------------

      - name: Generate Backend Attestation

        uses: actions/attest-build-provenance@v2

        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/veriface-ai-backend

          subject-digest: ${{ steps.backend.outputs.digest }}

          push-to-registry: true

# ----------------------------------------------------------
# Attest Frontend
# ----------------------------------------------------------

      - name: Generate Frontend Attestation

        uses: actions/attest-build-provenance@v2

        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/veriface-ai-frontend

          subject-digest: ${{ steps.frontend.outputs.digest }}

          push-to-registry: true

# ----------------------------------------------------------
# GitHub Release
# ----------------------------------------------------------

      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:
          generate_release_notes: true

          draft: false

          prerelease: false

          append_body: true

          body: |

            ## Published Images

            Backend

            ghcr.io/${{ github.repository_owner }}/veriface-ai-backend:${{ github.ref_name }}

            Frontend

            ghcr.io/${{ github.repository_owner }}/veriface-ai-frontend:${{ github.ref_name }}

# ----------------------------------------------------------
# Summary
# ----------------------------------------------------------

      - name: Release Summary

        run: |

          {
            echo "# VeriFace AI Release"
            echo
            echo "| Artifact | Status |"
            echo "| --- | --- |"
            echo "| Backend Image | ✅ Published |"
            echo "| Frontend Image | ✅ Published |"
            echo "| GitHub Release | ✅ Created |"
            echo
            echo "Version: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"