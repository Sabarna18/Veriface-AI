name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  BACKEND_IMAGE: veriface-backend
  FRONTEND_IMAGE: veriface-web

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # Verify tag belongs to main
      # -------------------------------------------------------

      - name: Verify tag originates from main
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "This tag was not created from the main branch."
            exit 1
          fi

      # -------------------------------------------------------
      # Python
      # -------------------------------------------------------

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv sync --locked --all-extras

      # -------------------------------------------------------
      # Run Tests
      # -------------------------------------------------------

      - name: Run backend tests
        working-directory: backend
        run: |
          uv run pytest

      # -------------------------------------------------------
      # Docker Buildx
      # -------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------
      # Login GHCR
      # -------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # Backend Metadata
      # -------------------------------------------------------

      - name: Backend Docker metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE }}

          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # -------------------------------------------------------
      # Frontend Metadata
      # -------------------------------------------------------

      - name: Frontend Docker metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}

          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # -------------------------------------------------------
      # Build Backend
      # -------------------------------------------------------

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true

          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------
      # Build Frontend
      # -------------------------------------------------------

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true

          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------
      # GitHub Release
      # -------------------------------------------------------

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
