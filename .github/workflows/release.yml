name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

# ==========================================================
# Permissions
# ==========================================================

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

# ==========================================================
# Concurrency
# ==========================================================

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================================
  # Build & Publish Images
  # ==========================================================

  publish:
    name: Build & Publish Containers

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup Buildx
      # ----------------------------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # ----------------------------------------------------------
      # Login GHCR
      # ----------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Backend Metadata
      # ----------------------------------------------------------

      - name: Backend Docker Metadata
        id: backend_meta

        uses: docker/metadata-action@v5

        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/veriface-ai-backend

          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha

          labels: |
            org.opencontainers.image.title=VeriFace AI Backend
            org.opencontainers.image.description=Production FastAPI Backend
            org.opencontainers.image.vendor=VeriFace AI
            org.opencontainers.image.licenses=MIT

      # ----------------------------------------------------------
      # Frontend Metadata
      # ----------------------------------------------------------

      - name: Frontend Docker Metadata
        id: frontend_meta

        uses: docker/metadata-action@v5

        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/veriface-ai-frontend

          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha

          labels: |
            org.opencontainers.image.title=VeriFace AI Frontend
            org.opencontainers.image.description=Production React Frontend
            org.opencontainers.image.vendor=VeriFace AI
            org.opencontainers.image.licenses=MIT

      # ----------------------------------------------------------
      # Build Backend
      # ----------------------------------------------------------

      - name: Build & Push Backend Image
        id: backend

        uses: docker/build-push-action@v6

        with:
          context: ./backend

          file: ./backend/Dockerfile

          platforms: linux/amd64

          push: true

          provenance: mode=max

          sbom: true

          tags: ${{ steps.backend_meta.outputs.tags }}

          labels: ${{ steps.backend_meta.outputs.labels }}

          cache-from: type=gha,scope=backend

          cache-to: type=gha,mode=max,scope=backend

      # ----------------------------------------------------------
      # Build Frontend
      # ----------------------------------------------------------

      - name: Build & Push Frontend Image
        id: frontend

        uses: docker/build-push-action@v6

        with:
          context: ./frontend

          file: ./frontend/Dockerfile

          platforms: linux/amd64

          push: true

          provenance: mode=max

          sbom: true

          tags: ${{ steps.frontend_meta.outputs.tags }}

          labels: ${{ steps.frontend_meta.outputs.labels }}

          cache-from: type=gha,scope=frontend

          cache-to: type=gha,mode=max,scope=frontend

      # ----------------------------------------------------------
      # Backend Provenance Attestation
      # ----------------------------------------------------------

      - name: Generate Backend Attestation

        uses: actions/attest-build-provenance@v2

        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/veriface-ai-backend

          subject-digest: ${{ steps.backend.outputs.digest }}

          push-to-registry: true

      # ----------------------------------------------------------
      # Frontend Provenance Attestation
      # ----------------------------------------------------------

      - name: Generate Frontend Attestation

        uses: actions/attest-build-provenance@v2

        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/veriface-ai-frontend

          subject-digest: ${{ steps.frontend.outputs.digest }}

          push-to-registry: true

      # ----------------------------------------------------------
      # Upload Compose File
      # ----------------------------------------------------------

      - name: Upload Deployment Assets

        uses: actions/upload-artifact@v4

        with:
          name: deployment-assets

          path: |
            compose.yml
            README.md
            LICENSE

          if-no-files-found: ignore

      # ----------------------------------------------------------
      # Create GitHub Release
      # ----------------------------------------------------------

      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:
          generate_release_notes: true

          append_body: true

          draft: false

          prerelease: false

          body: |

            ## 🚀 Published Container Images

            ### Backend

            `ghcr.io/${{ github.repository_owner }}/veriface-ai-backend:${{ github.ref_name }}`

            Digest

            `${{ steps.backend.outputs.digest }}`

            ---

            ### Frontend

            `ghcr.io/${{ github.repository_owner }}/veriface-ai-frontend:${{ github.ref_name }}`

            Digest

            `${{ steps.frontend.outputs.digest }}`

            ---

            Images include:

            - SBOM
            - OCI Metadata
            - Build Provenance
            - GitHub Attestations

      # ----------------------------------------------------------
      # Workflow Summary
      # ----------------------------------------------------------

      - name: Release Summary

        run: |

          {
            echo "# 🚀 VeriFace AI Release"
            echo
            echo "| Artifact | Status |"
            echo "| --- | --- |"
            echo "| Backend Image | ✅ Published |"
            echo "| Frontend Image | ✅ Published |"
            echo "| SBOM | ✅ Generated |"
            echo "| Provenance | ✅ Generated |"
            echo "| GitHub Attestation | ✅ Published |"
            echo "| GitHub Release | ✅ Created |"
            echo
            echo "## Version"
            echo
            echo "\`${{ github.ref_name }}\`"
            echo
            echo "## Backend Digest"
            echo
            echo "\`${{ steps.backend.outputs.digest }}\`"
            echo
            echo "## Frontend Digest"
            echo
            echo "\`${{ steps.frontend.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
