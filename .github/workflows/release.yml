name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

# ==========================================================
# Permissions
# ==========================================================

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

# ==========================================================
# Concurrency
# ==========================================================

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:

# ==========================================================
# Build & Publish Images
# ==========================================================

  publish:

    name: Build & Publish Images

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:

# ----------------------------------------------------------
# Checkout
# ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4



# ----------------------------------------------------------
# Extract Version
# ----------------------------------------------------------



      - name: Extract Version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"


# ----------------------------------------------------------
# Docker Buildx
# ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

# ----------------------------------------------------------
# Login GHCR
# ----------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

# ----------------------------------------------------------
# Backend Metadata
# ----------------------------------------------------------

      - name: Backend Docker Metadata
        id: backend_meta
        uses: docker/metadata-action@v5

        with:

          images: |
            ghcr.io/${{ github.repository_owner }}/veriface-ai-backend

          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha

          labels: |
            org.opencontainers.image.title=VeriFace AI Backend
            org.opencontainers.image.description=VeriFace AI FastAPI Backend
            org.opencontainers.image.vendor=VeriFace AI
            org.opencontainers.image.licenses=MIT

# ----------------------------------------------------------
# Web Metadata
# ----------------------------------------------------------

      - name: Web Docker Metadata
        id: web_meta
        uses: docker/metadata-action@v5

        with:

          images: |
            ghcr.io/${{ github.repository_owner }}/veriface-ai-web

          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha

          labels: |
            org.opencontainers.image.title=VeriFace AI Web
            org.opencontainers.image.description=VeriFace AI React + Nginx
            org.opencontainers.image.vendor=VeriFace AI
            org.opencontainers.image.licenses=MIT

# ----------------------------------------------------------
# Build Backend
# ----------------------------------------------------------

      - name: Build & Push Backend Image
        id: backend

        uses: docker/build-push-action@v6

        with:

          context: ./backend

          file: ./backend/Dockerfile

          platforms: linux/amd64

          push: true

          provenance: mode=max

          sbom: true

          tags: ${{ steps.backend_meta.outputs.tags }}

          labels: ${{ steps.backend_meta.outputs.labels }}

          cache-from: type=gha,scope=backend

          cache-to: type=gha,mode=max,scope=backend

# ----------------------------------------------------------
# Build Web
# ----------------------------------------------------------

      - name: Build & Push Web Image
        id: web

        uses: docker/build-push-action@v6

        with:

          context: .

          file: ./nginx/Dockerfile

          platforms: linux/amd64

          push: true

          provenance: mode=max

          sbom: true

          tags: ${{ steps.web_meta.outputs.tags }}

          labels: ${{ steps.web_meta.outputs.labels }}

          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}

          cache-from: type=gha,scope=web

          cache-to: type=gha,mode=max,scope=web

# ----------------------------------------------------------
# Backend Attestation
# ----------------------------------------------------------

      - name: Generate Backend Attestation
        uses: actions/attest-build-provenance@v2

        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/veriface-ai-backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true

# ----------------------------------------------------------
# Web Attestation
# ----------------------------------------------------------

      - name: Generate Web Attestation
        uses: actions/attest-build-provenance@v2

        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/veriface-ai-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

# ----------------------------------------------------------
# Upload Release Assets
# ----------------------------------------------------------

      - name: Upload Deployment Assets
        uses: actions/upload-artifact@v4

        with:
          name: deployment-assets

          path: |
            compose.yml
            README.md
            LICENSE

          if-no-files-found: ignore

# ----------------------------------------------------------
# Create GitHub Release
# ----------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          generate_release_notes: true

          draft: false

          prerelease: false

          append_body: true

          body: |

            ## 🚀 Published Images

            ### Backend

            ghcr.io/${{ github.repository_owner }}/veriface-ai-backend:${{ github.ref_name }}

            Digest

            `${{ steps.backend.outputs.digest }}`

            ---

            ### Web

            ghcr.io/${{ github.repository_owner }}/veriface-ai-web:${{ github.ref_name }}

            Digest

            `${{ steps.web.outputs.digest }}`

            ---

            ### Included

            - OCI Image Metadata
            - Software Bill of Materials (SBOM)
            - SLSA Build Provenance
            - GitHub Artifact Attestations


# ----------------------------------------------------------
# Workflow Summary
# ----------------------------------------------------------

      - name: Release Summary

        run: |

          {
            echo "# 🚀 VeriFace AI Release"
            echo
            echo "| Artifact | Status |"
            echo "| --- | --- |"
            echo "| Backend Image | ✅ Published |"
            echo "| Web Image | ✅ Published |"
            echo "| SBOM | ✅ Generated |"
            echo "| Provenance | ✅ Generated |"
            echo "| Attestations | ✅ Published |"
            echo "| GitHub Release | ✅ Created |"
            echo
            echo "## Version"
            echo
            echo "\`${{ github.ref_name }}\`"
            echo
            echo "## Backend Digest"
            echo
            echo "\`${{ steps.backend.outputs.digest }}\`"
            echo
            echo
            echo "## Web Digest"
            echo
            echo "\`${{ steps.web.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"