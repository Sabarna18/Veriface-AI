name: Docker Verification

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
    paths:
      - "backend/**"
      - "frontend/**"
      - "nginx/**"
      - "scripts/docker.sh"
      - "compose.yml"
      - ".github/workflows/docker.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "frontend/**"
      - "nginx/**"
      - "scripts/docker.sh"
      - "compose.yml"
      - ".github/workflows/docker.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: compose.yml
  HEALTH_TIMEOUT: "240"
  POLL_INTERVAL: "5"

jobs:
  docker-verification:
    name: Docker Stack Verification

    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      # ======================================================
      # Repository
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # Docker
      # ======================================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show Docker Environment
        run: |
          docker --version
          docker compose version

      # ======================================================
      # Script Validation
      # ======================================================

      - name: Make Docker Script Executable
        run: chmod +x scripts/docker.sh

      - name: Validate Docker Script
        run: bash -n scripts/docker.sh

      # ======================================================
      # Stack Verification
      # ======================================================

      - name: Run Docker Verification
        run: ./scripts/docker.sh

      # ======================================================
      # Summary
      # ======================================================

      - name: Generate Docker Summary
        if: always()
        run: |
          {
            echo "# VeriFace AI — Docker Verification"
            echo
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Compose | \`${{ env.COMPOSE_FILE }}\` |"
            echo "| Health timeout | \`${{ env.HEALTH_TIMEOUT }}s\` |"
            echo
            echo "Docker stack verification workflow completed."
          } >> "$GITHUB_STEP_SUMMARY"
