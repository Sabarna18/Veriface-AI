# ============================================================
# VeriFace AI
# GHCR Container Registry Cleanup
#
# Purpose:
#   Remove old UNTAGGED container versions from GHCR.
#
# Packages:
#   - veriface-ai-backend
#   - veriface-ai-web
#
# Safety:
#   - Tagged versions are NEVER deleted.
#   - Only untagged versions are candidates.
#   - Keeps the newest 10 untagged versions.
#   - Missing packages are handled gracefully.
# ============================================================

name: Cleanup Registry

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cleanup-registry
  cancel-in-progress: false

env:
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  cleanup:
    name: Cleanup GHCR
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        package:
          - veriface-ai-backend
          - veriface-ai-web

    steps:
      # ======================================================
      # 1. Cleanup Package
      # ======================================================

      - name: Cleanup untagged GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ matrix.package }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo " VeriFace AI — GHCR Cleanup"
          echo "============================================================"
          echo ""

          # --------------------------------------------------
          # Normalize owner
          # --------------------------------------------------

          OWNER="$(printf '%s' "${GHCR_OWNER}" | tr '[:upper:]' '[:lower:]')"

          echo "Owner   : ${OWNER}"
          echo "Package : ${PACKAGE_NAME}"
          echo ""

          # --------------------------------------------------
          # Verify GitHub CLI
          # --------------------------------------------------

          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI is not installed."
            exit 1
          fi

          echo "✓ GitHub CLI available."

          # --------------------------------------------------
          # Check package existence
          # --------------------------------------------------

          echo ""
          echo "[1/4] Checking package..."

          PACKAGE_URL="https://api.github.com/user/packages/container/${PACKAGE_NAME}"

          if ! gh api \
              "${PACKAGE_URL}" \
              >/dev/null 2>&1; then

            echo "⚠ Package does not exist:"
            echo "  ghcr.io/${OWNER}/${PACKAGE_NAME}"
            echo ""
            echo "Skipping package."
            exit 0
          fi

          echo "✓ Package exists."

          # --------------------------------------------------
          # Fetch all package versions
          # --------------------------------------------------

          echo ""
          echo "[2/4] Fetching package versions..."

          VERSIONS_JSON="$(
            gh api \
              --paginate \
              "/user/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
              --slurp
          )"

          # --------------------------------------------------
          # Extract versions
          #
          # GitHub returns an array for each paginated page.
          # Flatten all pages into one array.
          # --------------------------------------------------

          ALL_VERSIONS="$(
            printf '%s' "${VERSIONS_JSON}" |
              jq -c 'add'
          )"

          TOTAL_COUNT="$(
            printf '%s' "${ALL_VERSIONS}" |
              jq 'length'
          )"

          echo "Total versions: ${TOTAL_COUNT}"

          # --------------------------------------------------
          # Find untagged versions
          #
          # Tagged versions have one or more metadata tags.
          # Untagged versions have an empty tags array.
          # --------------------------------------------------

          UNTAGGED_IDS="$(
            printf '%s' "${ALL_VERSIONS}" |
              jq -r '
                [
                  .[]
                  | select((.metadata.container.tags // []) | length == 0)
                  | {
                      id: .id,
                      created_at: .created_at
                    }
                ]
                | sort_by(.created_at)
                | reverse
                | .[10:]
                | .[].id
              '
          )"

          UNTAGGED_COUNT="$(
            printf '%s\n' "${UNTAGGED_IDS}" |
              sed '/^[[:space:]]*$/d' |
              wc -l |
              tr -d ' '
          )"

          # --------------------------------------------------
          # Count total untagged versions
          # --------------------------------------------------

          TOTAL_UNTAGGED="$(
            printf '%s' "${ALL_VERSIONS}" |
              jq '
                [
                  .[]
                  | select((.metadata.container.tags // []) | length == 0)
                ]
                | length
              '
          )"

          echo "Total untagged versions : ${TOTAL_UNTAGGED}"
          echo "Versions retained       : 10"
          echo "Versions to delete      : ${UNTAGGED_COUNT}"

          # --------------------------------------------------
          # Nothing to delete
          # --------------------------------------------------

          if [ "${UNTAGGED_COUNT}" -eq 0 ]; then
            echo ""
            echo "✓ Nothing to clean."
            echo ""
            echo "All tagged versions remain untouched."
            exit 0
          fi

          # --------------------------------------------------
          # Delete old untagged versions
          # --------------------------------------------------

          echo ""
          echo "[3/4] Deleting old untagged versions..."
          echo ""

          DELETED=0
          FAILED=0

          while IFS= read -r VERSION_ID; do

            [ -n "${VERSION_ID}" ] || continue

            echo "Deleting version ID: ${VERSION_ID}"

            if gh api \
                --method DELETE \
                "/user/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}"; then

              echo "✓ Deleted ${VERSION_ID}"
              DELETED=$((DELETED + 1))

            else

              echo "✗ Failed to delete ${VERSION_ID}"
              FAILED=$((FAILED + 1))

            fi

            echo ""

          done <<< "${UNTAGGED_IDS}"

          # --------------------------------------------------
          # Final summary
          # --------------------------------------------------

          echo "[4/4] Cleanup summary"
          echo ""
          echo "Package                : ${PACKAGE_NAME}"
          echo "Total versions         : ${TOTAL_COUNT}"
          echo "Total untagged         : ${TOTAL_UNTAGGED}"
          echo "Retained untagged      : 10"
          echo "Deleted                : ${DELETED}"
          echo "Failed                 : ${FAILED}"
          echo ""

          # --------------------------------------------------
          # Fail workflow if deletion failed
          # --------------------------------------------------

          if [ "${FAILED}" -gt 0 ]; then
            echo "ERROR: One or more versions could not be deleted."
            exit 1
          fi

          echo "✓ GHCR cleanup completed successfully."
