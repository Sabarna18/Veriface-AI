pid /tmp/nginx.pid;

worker_processes auto;

events {
    worker_connections 1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    server {

        listen 8000;

        server_name _;

        root /usr/share/nginx/html;

        index index.html;

        # React SPA
        location / {
            try_files $uri /index.html;
        }

        # Reverse Proxy
        location /api/ {

            # /api/users/ -> backend:8002/users/
            proxy_pass http://backend:8002/;

            proxy_http_version 1.1;

            # --------------------------------------------------
            # Preserve API namespace on backend redirects
            # --------------------------------------------------
            # FastAPI:
            #   /attendance/today/ -> 307 /attendance/today
            #
            # Nginx rewrites:
            #   Location: /attendance/today
            # to:
            #   Location: /api/attendance/today
            # --------------------------------------------------
            proxy_redirect ~^(/.*)$ /api$1;

            # --------------------------------------------------
            # Forward original request information
            # --------------------------------------------------
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }

        client_max_body_size 25M;
    }
}