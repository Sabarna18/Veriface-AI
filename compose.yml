name: veriface-ai

services:
  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:
    image: postgres:17-alpine
    container_name: veriface-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - veriface-network

  # ==========================================================
  # FastAPI Backend
  # ==========================================================

  backend:
    container_name: veriface-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATA_DIR: /app/data

      # Legacy migration must not run during normal startup.
      MIGRATE_LEGACY_DB: "false"

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8002"

    volumes:
      # Application data
      - backend_data:/app/data

      # Application-managed ML models
      - backend_models:/app/models

      # DeepFace model weights
      - deepface_weights:/root/.deepface/weights

      # Application logs
      - backend_logs:/app/logs

    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - veriface-network

  # ==========================================================
  # Nginx + React
  # ==========================================================

  web:
    container_name: veriface-web

    build:
      context: .
      dockerfile: nginx/Dockerfile

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:8000"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - veriface-network

# ==========================================================
# Volumes
# ==========================================================

volumes:
  postgres_data:

  backend_data:

  backend_models:

  deepface_weights:

  backend_logs:

# ==========================================================
# Networks
# ==========================================================

networks:
  veriface-network:
    driver: bridge
