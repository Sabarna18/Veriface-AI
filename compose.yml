name: veriface-ai

services:
  # ==========================================================
  # Backend
  # ==========================================================

  backend:
    container_name: veriface-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATA_DIR: /app/data

      WAIT_FOR_DATABASE: "true"
      RUN_MIGRATIONS: "true"
      RUN_LEGACY_MIGRATION: "false"

    expose:
      - "8002"

    volumes:
      - backend_data:/app/data
      - backend_models:/app/models
      - deepface_weights:/home/veriface/.deepface/weights
      - backend_logs:/app/logs

    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - veriface-network

  # ==========================================================
  # Frontend
  # ==========================================================

  web:
    container_name: veriface-web

    build:
      context: .
      dockerfile: nginx/Dockerfile

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:8000"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - veriface-network

# ==========================================================
# Volumes
# ==========================================================

volumes:
  backend_data:
  backend_models:
  deepface_weights:
  backend_logs:

# ==========================================================
# Networks
# ==========================================================

networks:
  veriface-network:
    driver: bridge
