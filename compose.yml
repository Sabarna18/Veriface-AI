name: veriface-ai

services:
  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:
    image: postgres:17-alpine
    container_name: veriface-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - veriface-network

  # ==========================================================
  # FastAPI Backend
  # ==========================================================

  backend:
    container_name: veriface-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      # ------------------------------------------------------
      # Application data directory inside container
      # ------------------------------------------------------
      DATA_DIR: /app/data

      # ------------------------------------------------------
      # Legacy SQLite -> PostgreSQL migration
      # TEMPORARY: Disable after successful migration
      # ------------------------------------------------------
      MIGRATE_LEGACY_DB: "true"
      LEGACY_DB_PATH: /app/legacy/attendance.db

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8002"

    volumes:
      # ------------------------------------------------------
      # Persistent application data
      # ------------------------------------------------------
      - backend_data:/app/data

      # ------------------------------------------------------
      # Cached ML / DeepFace models
      # ------------------------------------------------------
      - backend_models:/app/models

      # ------------------------------------------------------
      # Application logs
      # ------------------------------------------------------
      - backend_logs:/app/logs

      # ------------------------------------------------------
      # Legacy SQLite database
      # TEMPORARY: Used only for PostgreSQL migration
      # Mounted read-only to protect original database
      # ------------------------------------------------------
      - ./backend/attendance.db:/app/legacy/attendance.db:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - veriface-network

  # ==========================================================
  # Nginx + React
  # ==========================================================

  web:
    container_name: veriface-web

    build:
      context: .
      dockerfile: nginx/Dockerfile

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - veriface-network

# ==========================================================
# Volumes
# ==========================================================

volumes:
  # PostgreSQL persistent database
  postgres_data:

  # Face images, embeddings, attendance files
  backend_data:

  # ML model cache
  backend_models:

  # Backend application logs
  backend_logs:

# ==========================================================
# Networks
# ==========================================================

networks:
  veriface-network:
    driver: bridge
